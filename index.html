<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Prospector MD</title>
<style>
:root{--bg:#f5f4f0;--surface:#fff;--surface-2:#f0efe9;--border:rgba(0,0,0,0.1);--border-strong:rgba(0,0,0,0.18);--text:#1a1a18;--text-2:#5a5a56;--text-3:#9a9a94;--accent:#1a6ef5;--accent-bg:#e8f0fe;--accent-text:#1a4db5;--success:#16a34a;--success-bg:#dcfce7;--warning:#d97706;--warning-bg:#fef3c7;--danger:#dc2626;--danger-bg:#fee2e2;--radius:10px;--radius-lg:16px;--shadow:0 1px 4px rgba(0,0,0,0.08),0 0 0 0.5px rgba(0,0,0,0.06)}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--surface:#252523;--surface-2:#2e2e2b;--border:rgba(255,255,255,0.1);--border-strong:rgba(255,255,255,0.18);--text:#f0efe9;--text-2:#a8a8a2;--text-3:#6a6a64;--accent-bg:#1e2e50;--accent-text:#93b4f7;--success-bg:#14291f;--warning-bg:#29200d;--danger-bg:#291414;--shadow:0 1px 4px rgba(0,0,0,0.3)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;min-height:100vh}
.nav{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px}
.nav-title{font-size:17px;font-weight:600;letter-spacing:-.3px}
.nav-sub{font-size:12px;color:var(--text-3)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:18px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:.5px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;cursor:pointer;border:none;background:none;color:var(--text-3);font-size:10px;font-weight:500;transition:color .15s}
.nav-item.active{color:var(--accent)}
.nav-item svg{width:22px;height:22px}
.page{display:none;padding:16px 16px calc(80px + env(safe-area-inset-bottom))}
.page.active{display:block}
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-body{padding:16px}
.section-header{font-size:13px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 8px}
.prospect-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:.5px solid var(--border);cursor:pointer;background:var(--surface);transition:background .1s}
.prospect-row:last-child{border-bottom:none}
.prospect-row:active{background:var(--surface-2)}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0}
.prospect-info{flex:1;min-width:0}
.prospect-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prospect-meta{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prospect-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-hot{background:#fee2e2;color:#991b1b}.badge-warm{background:#fef3c7;color:#92400e}.badge-cold{background:#e0f2fe;color:#0c4a6e}.badge-closed{background:#dcfce7;color:#14532d}.badge-lost{background:var(--surface-2);color:var(--text-3)}
@media(prefers-color-scheme:dark){.badge-hot{background:#3f0d0d;color:#fca5a5}.badge-warm{background:#3f2800;color:#fcd34d}.badge-cold{background:#0c2340;color:#7dd3fc}.badge-closed{background:#0d2e16;color:#86efac}}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{background:var(--surface-2);border-radius:var(--radius);padding:12px}
.stat-label{font-size:12px;color:var(--text-3);margin-bottom:2px}
.stat-value{font-size:20px;font-weight:700}
.tabs{display:flex;background:var(--surface-2);border-radius:var(--radius);padding:3px;margin-bottom:16px}
.tab{flex:1;padding:8px;text-align:center;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--text-2);transition:all .15s;border:none;background:none}
.tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.mode-toggle{display:flex;background:var(--surface-2);border-radius:var(--radius);padding:3px;margin-bottom:16px}
.mode-btn{flex:1;padding:8px;text-align:center;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--text-2);border:none;background:none;transition:all .15s}
.mode-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:11px 14px;border-radius:var(--radius);border:.5px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:16px;font-family:inherit;appearance:none;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,110,245,.12)}
.field textarea{resize:vertical;min-height:80px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chat-container{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;max-height:300px;overflow-y:auto;padding:4px 0}
.bubble{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.bubble-user{background:var(--accent);color:white;border-bottom-right-radius:4px;align-self:flex-end}
.bubble-ai{background:var(--surface-2);color:var(--text);border-bottom-left-radius:4px;align-self:flex-start;border:.5px solid var(--border)}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input-row textarea{flex:1;border-radius:20px;padding:10px 16px;min-height:42px;max-height:120px;resize:none}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn svg{width:18px;height:18px;fill:white}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97);opacity:.85}
.btn-primary{background:var(--accent);color:white}
.btn-secondary{background:var(--surface-2);color:var(--text);border:.5px solid var(--border-strong)}
.btn-success{background:var(--success);color:white}
.btn-danger{background:var(--danger);color:white}
.btn-full{width:100%}
.btn-sm{padding:7px 14px;font-size:13px}
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:12px}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;border:.5px solid var(--border-strong);background:var(--surface);color:var(--text-2);transition:all .15s}
.filter-chip.active{background:var(--accent);color:white;border-color:var(--accent)}
.empty{text-align:center;padding:48px 24px;color:var(--text-3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty h3{font-size:17px;color:var(--text-2);margin-bottom:6px}
.empty p{font-size:14px;line-height:1.6}
.sheet-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.5);display:none;align-items:flex-end}
.sheet-overlay.open{display:flex}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet-handle{width:36px;height:4px;background:var(--border-strong);border-radius:2px;margin:0 auto 16px}
.api-banner{background:var(--warning-bg);border:.5px solid rgba(217,119,6,.3);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:14px;color:var(--warning)}
.rec-card{background:var(--accent-bg);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;border:1px solid rgba(26,110,245,.2)}
.rec-type{font-size:12px;font-weight:700;color:var(--accent-text);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.rec-title{font-size:18px;font-weight:700;color:var(--accent-text);margin-bottom:12px;line-height:1.2}
.rec-message{background:var(--surface);border-radius:var(--radius);padding:14px;font-size:15px;line-height:1.6;color:var(--text);margin-bottom:12px;border:.5px solid var(--border);white-space:pre-wrap}
.rec-reason{font-size:13px;color:var(--accent-text);opacity:.8;line-height:1.5}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:0;width:1px;background:var(--border)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-20px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl-date{font-size:11px;color:var(--text-3);margin-bottom:2px}
.tl-content{font-size:14px;line-height:1.5;color:var(--text);background:var(--surface-2);padding:10px 12px;border-radius:var(--radius);border:.5px solid var(--border)}
.tl-sent{font-size:12px;color:var(--text-3);margin-top:4px;font-style:italic}
.prob-circle{position:relative;width:72px;height:72px;flex-shrink:0}
.prob-circle svg{transform:rotate(-90deg)}
.prob-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.divider{height:.5px;background:var(--border);margin:16px 0}
.text-sm{font-size:13px;color:var(--text-2)}
.text-xs{font-size:12px;color:var(--text-3)}
.mem-row{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--border)}
.mem-row:last-child{border-bottom:none}
.loading-dots span{animation:blink 1.2s infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>

<div class="nav">
  <div>
    <div class="nav-title">Prospector MD</div>
    <div class="nav-sub" id="nav-date"></div>
  </div>
  <button class="icon-btn" onclick="openSettings()">⚙️</button>
</div>

<div class="page active" id="page-today"><div id="today-content"></div></div>
<div class="page" id="page-prospects"><div id="prospects-content"></div></div>
<div class="page" id="page-add"><div id="add-content"></div></div>
<div class="page" id="page-brain"><div id="brain-content"></div></div>

<div class="bottom-nav">
  <button class="nav-item active" id="nav-today" onclick="showPage('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Hoy
  </button>
  <button class="nav-item" id="nav-prospects" onclick="showPage('prospects')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Prospectos
  </button>
  <button class="nav-item" id="nav-add" onclick="showPage('add')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Nuevo
  </button>
  <button class="nav-item" id="nav-brain" onclick="showPage('brain')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>Cerebro
  </button>
</div>

<!-- Sheet: Prospect Detail -->
<div class="sheet-overlay" id="sheet-detail" onclick="if(event.target===this)closeSheet('sheet-detail')">
  <div class="sheet" id="sheet-detail-content"></div>
</div>

<!-- Sheet: Settings -->
<div class="sheet-overlay" id="sheet-settings" onclick="if(event.target===this)closeSheet('sheet-settings')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div style="font-size:18px;font-weight:700;margin-bottom:20px">⚙️ Configuración</div>
    <div class="field"><label>API Key de Anthropic</label><input type="password" id="cfg-api-key" placeholder="sk-ant-..."/><div class="text-xs" style="margin-top:5px">Solo en este dispositivo. Nunca sale a ningún servidor.</div></div>
    <div class="divider"></div>
    <div class="field"><label>Apps Script Web App URL</label><input type="text" id="cfg-script-url" placeholder="https://script.google.com/macros/s/..."/><div class="text-xs" style="margin-top:5px">Para sincronizar con Google Sheets y Calendar.</div></div>
    <div class="divider"></div>
    <div class="field"><label>Tu voz / cómo hablas</label><textarea id="cfg-voice" placeholder="Ej: Soy Carlos, asesor financiero. Soy directo pero cercano, uso lenguaje casual..." style="min-height:90px"></textarea></div>
    <button class="btn btn-primary btn-full" onclick="saveSettings()">Guardar configuración</button>
    <div style="height:12px"></div>
    <button class="btn btn-secondary btn-full" onclick="closeSheet('sheet-settings')">Cerrar</button>
  </div>
</div>

<script>
// ── Storage ───────────────────────────────────────────────────────────────────
var DB_KEY    = 'pmd_db_v3';
var CFG_KEY   = 'pmd_cfg_v3';
var BRAIN_KEY = 'pmd_brain_v3';
var BCHAT_KEY = 'pmd_bchat_v3';

function loadDB()    { try { return JSON.parse(localStorage.getItem(DB_KEY))    || {prospects:[],interactions:[]}; } catch(e){ return {prospects:[],interactions:[]}; } }
function saveDB(d)   { localStorage.setItem(DB_KEY, JSON.stringify(d)); }
function loadCfg()   { try { return JSON.parse(localStorage.getItem(CFG_KEY))   || {}; } catch(e){ return {}; } }
function saveCfg(c)  { localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
function loadBrain() { try { return JSON.parse(localStorage.getItem(BRAIN_KEY)) || {memories:[]}; } catch(e){ return {memories:[]}; } }
function saveBrain(b){ localStorage.setItem(BRAIN_KEY, JSON.stringify(b)); }
function loadBChat() { try { return JSON.parse(localStorage.getItem(BCHAT_KEY)) || []; } catch(e){ return []; } }
function saveBChat(c){ localStorage.setItem(BCHAT_KEY, JSON.stringify(c.slice(-80))); }
function uid()       { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ── Settings ──────────────────────────────────────────────────────────────────
function openSettings() {
  var cfg = loadCfg();
  document.getElementById('cfg-api-key').value    = cfg.apiKey    || '';
  document.getElementById('cfg-script-url').value = cfg.scriptUrl || '';
  document.getElementById('cfg-voice').value      = cfg.voice     || '';
  openSheet('sheet-settings');
}
async function saveSettings() {
  var cfg = {
    apiKey:    document.getElementById('cfg-api-key').value.trim(),
    scriptUrl: document.getElementById('cfg-script-url').value.trim(),
    voice:     document.getElementById('cfg-voice').value.trim()
  };
  saveCfg(cfg);
  if (cfg.scriptUrl && cfg.voice) {
    try { await postToSheets({type:'config', data:{voice:cfg.voice}}); } catch(e){}
  }
  closeSheet('sheet-settings');
  alert('✅ Configuración guardada');
}

// ── Navigation ────────────────────────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if (name==='today')     renderToday();
  if (name==='prospects') renderProspects();
  if (name==='add')       renderAdd();
  if (name==='brain')     renderBrain();
}
function openSheet(id)  { document.getElementById(id).classList.add('open'); }
function closeSheet(id) { document.getElementById(id).classList.remove('open'); }

// ── Sync ──────────────────────────────────────────────────────────────────────
async function postToSheets(payload) {
  var cfg = loadCfg();
  if (!cfg.scriptUrl) return;
  try {
    await fetch(cfg.scriptUrl, {method:'POST', body:JSON.stringify(payload), headers:{'Content-Type':'text/plain;charset=utf-8'}});
  } catch(e){}
}
async function syncCalendar(p) {
  var cfg = loadCfg();
  if (!cfg.scriptUrl || !p.nextContact) return;
  try {
    await postToSheets({type:'calendar', data:{prospectId:p.id, name:p.name, product:p.product, source:p.source||'', nextContact:new Date(p.nextContact).toISOString()}});
  } catch(e){}
}
async function syncFromSheets() {
  var cfg = loadCfg();
  if (!cfg.scriptUrl) return false;
  try {
    var res  = await fetch(cfg.scriptUrl + '?t=' + Date.now());
    var data = await res.json();
    if (!data.ok) return false;
    if (data.prospects) {
      var localDB = loadDB();
      var recCache = {};
      localDB.prospects.forEach(function(p){ if(p._rec) recCache[p.id]=p._rec; });
      var prospects = data.prospects.map(function(r){ return {
        id:r.id,name:r.name,phone:r.phone||'',age:r.age||'',product:r.product||'',
        investment:r.investment||'',city:r.city||'',status:r.status||'cold',
        probability:Number(r.probability||20),source:r.source||'',sourceDetail:r.sourceDetail||'',
        notes:r.notes||'',context:r.context||'',nextContact:r.nextContact||'',
        createdAt:r.createdAt||new Date().toISOString(),_rec:recCache[r.id]||null
      }; });
      var interactions = (data.interactions||[]).map(function(r){ return {
        id:r.id,prospectId:r.prospectId,date:r.date,summary:r.summary||'',sent:r.sent||'',response:r.response||''
      }; });
      saveDB({prospects:prospects,interactions:interactions});
    }
    if (data.brain && data.brain.length) {
      var brain = loadBrain();
      data.brain.forEach(function(rm){
        var idx = brain.memories.findIndex(function(lm){ return lm.id===rm.id; });
        if (idx===-1) brain.memories.push({id:rm.id,cat:rm.cat,text:rm.text,createdAt:rm.createdAt,deleted:rm.deleted==='true'});
        else { brain.memories[idx].text=rm.text; brain.memories[idx].deleted=rm.deleted==='true'; }
      });
      saveBrain(brain);
    }
    if (data.config && data.config.voice) {
      var cfg2 = loadCfg();
      if (!cfg2.voice) { cfg2.voice=data.config.voice; saveCfg(cfg2); }
    }
    return true;
  } catch(e){ console.warn('sync error',e); return false; }
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function daysBetween(s){ if(!s)return 999; return Math.floor((new Date()-new Date(s))/86400000); }
function fmtDate(s){ if(!s)return ''; return new Date(s).toLocaleDateString('es-MX',{day:'numeric',month:'short'}); }
function fmtDT(s){ if(!s)return ''; return new Date(s).toLocaleDateString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function avatarColor(name){
  var cols=[['#EEEDFE','#534AB7'],['#E1F5EE','#0F6E56'],['#FAECE7','#993C1D'],['#FBEAF0','#993556'],['#E6F1FB','#185FA5'],['#FAEEDA','#854F0B']];
  var h=0; for(var i=0;i<(name||'?').length;i++) h=(h*31+(name||'?').charCodeAt(i))%cols.length; return cols[h];
}
function initials(n){ if(!n)return '?'; return n.trim().split(' ').slice(0,2).map(function(w){return w[0];}).join('').toUpperCase(); }
function esc(s){ if(s===undefined||s===null)return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
var LOADING_DOTS='<span class="loading-dots"><span>●</span><span>●</span><span>●</span></span>';
function statusBadge(s){
  var labels={hot:'🔥 Caliente',warm:'🌡 Tibio',cold:'❄️ Frío',closed:'✅ Cerrado',lost:'❌ Perdido'};
  var cls={hot:'badge-hot',warm:'badge-warm',cold:'badge-cold',closed:'badge-closed',lost:'badge-lost'};
  return '<span class="badge '+(cls[s]||'badge-cold')+'">'+(labels[s]||s)+'</span>';
}
function productLabel(p){ return {gmm:'Gastos Médicos',retiro:'Plan de Retiro',vida:'Seguro de Vida',otro:'Otro'}[p]||p||''; }
function sourceLabel(s){ return {recomendacion:'Recomendación',ukuvi:'Ukuvi',redes:'Redes sociales',evento:'Evento / Networking',frio:'Llamada en frío',otro:'Otro'}[s]||s||'—'; }
function needsFollowup(p,interactions){
  if(p.status==='closed'||p.status==='lost') return false;
  var pInts=interactions.filter(function(i){return i.prospectId===p.id;}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  if(p.nextContact) return new Date(p.nextContact)<=new Date();
  if(!pInts.length) return true;
  return daysBetween(pInts[0].date)>=3;
}

function buildBrainCtx(){
  var brain=loadBrain(); var cfg=loadCfg();
  var mems=brain.memories.filter(function(m){return !m.deleted;});
  var cats={voz:'Voz y tono',regla:'Regla',producto:'Producto/Mercado',objecion:'Objeción',contexto:'Contexto'};
  var ctx=cfg.voice?'Voz del asesor: '+cfg.voice+'\n':'';
  Object.keys(cats).forEach(function(cat){
    var items=mems.filter(function(m){return m.cat===cat;});
    if(items.length) ctx+='['+cats[cat]+'] '+items.map(function(m){return m.text;}).join(' | ')+'\n';
  });
  return ctx;
}

    +'\n\nHISTORIAL:\n'+hist

  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':cfg.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:600,messages:[{role:'user',content:prompt}]})});

    var db2=loadDB(); var idx=db2.prospects.findIndex(function(x){return x.id===currentId;});

function updateStatus(id){
  var order=['cold','warm','hot','closed','lost'];
  var labels={cold:'❄️ Frío',warm:'🌡 Tibio',hot:'🔥 Caliente',closed:'✅ Cerrado',lost:'❌ Perdido'};
  var db=loadDB(); var p=db.prospects.find(function(x){return x.id===id;});
  var cur=order.indexOf(p.status||'cold'); var nxt=(cur+1)%order.length;
  if(!confirm('Cambiar a '+labels[order[nxt]]+'?'))return;
  var idx=db.prospects.findIndex(function(x){return x.id===id;});
  db.prospects[idx].status=order[nxt]; delete db.prospects[idx]._rec; saveDB(db);
  postToSheets({type:'prospect',data:db.prospects[idx]});
  renderDetail();
}

var brainTab='chat', brainChat=[];
var MEM_CATS={voz:{icon:'🗣',label:'Voz y tono'},regla:{icon:'📋',label:'Regla'},producto:{icon:'📦',label:'Producto / Mercado'},objecion:{icon:'🛡',label:'Objeción'},contexto:{icon:'🧠',label:'Contexto general'}};

function switchBrainTab(t){ brainTab=t; renderBrain(); }

function buildBrainSys(){
  var brain=loadBrain(); var cfg=loadCfg();
  var mems=brain.memories.filter(function(m){return !m.deleted;});
  var voice=cfg.voice?'Perfil del asesor: '+cfg.voice+'\n':'';
  var memBlock='';
  Object.keys(MEM_CATS).forEach(function(cat){
    var items=mems.filter(function(m){return m.cat===cat;});
    if(items.length){memBlock+='\n['+MEM_CATS[cat].label+']\n';items.forEach(function(m){memBlock+='- '+m.text+'\n';});}
  });
  return 'Eres el segundo cerebro de un asesor de seguros mexicano (GMM y Planes de Retiro).\n'+voice
    +'\nRol: compañero de pensamiento con criterio propio. NO dices que sí a todo.\n'
    +'- Si algo no te convence, arguméntalo brevemente.\n'
    +'- Habla en español mexicano, informal pero profesional.\n'
    +'- Cuando detectes algo que vale guardar como memoria permanente, agrega al FINAL "---MEM---" seguido de JSON en una línea: {"cat":"voz|regla|producto|objecion|contexto","text":"la memoria en una oración"}. Solo cuando sea realmente importante o el asesor lo pida.\n'
    +'- Para borrar/editar memoria existente agrega "---DEL---id" o "---EDIT---{"id":"...","text":"..."}".\n'
    +'\nMemorias activas:'+(memBlock||'\n(Ninguna todavía.)');
}

function renderBrain(){
  brainChat=loadBChat();
  var brain=loadBrain(); var cfg=loadCfg();
  var mems=brain.memories.filter(function(m){return !m.deleted;});
  var html='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">'
    +'<div><div style="font-size:20px;font-weight:700">🧠 Cerebro</div>'
    +'<div class="text-xs" style="margin-top:2px">'+mems.length+' memoria'+(mems.length!==1?'s':'')+' activa'+(mems.length!==1?'s':'')+'</div></div>'
    +'<button class="btn btn-secondary btn-sm" onclick="clearBrainChat()">Limpiar chat</button>'
    +'</div>'
    +'<div class="tabs">'
    +'<button class="tab'+(brainTab==='chat'?' active':'')+'" onclick="switchBrainTab(\'chat\')">💬 Conversación</button>'
    +'<button class="tab'+(brainTab==='memories'?' active':'')+'" onclick="switchBrainTab(\'memories\')">📌 Memorias ('+mems.length+')</button>'
    +'</div>';

  if(brainTab==='chat'){
    if(!cfg.apiKey) html+='<div class="api-banner">⚠️ Configura tu API key en ⚙️ para activar el cerebro.</div>';
    html+='<div class="chat-container" id="brain-chat" style="max-height:calc(100vh - 360px);min-height:180px">';
    if(!brainChat.length) html+='<div class="bubble bubble-ai">Hola. Soy tu segundo cerebro. Podemos hablar sobre cómo manejar situaciones, afinar tus mensajes, definir reglas, o lo que necesites. Si no estoy de acuerdo contigo en algo, te lo digo. ¿Por dónde empezamos?</div>';
    brainChat.forEach(function(m,idx){
      var isLoading=(m.content===LOADING_DOTS);
      var display=isLoading?m.content:esc(m.content.replace(/---MEM---[\s\S]*?(\n|$)/g,'').replace(/---DEL---[\s\S]*?(\n|$)/g,'').replace(/---EDIT---[\s\S]*?(\n|$)/g,'').trim());
      if(m.role==='user'){
        html+='<div class="bubble bubble-user">'+display+'</div>';
      } else {
        html+='<div class="bubble bubble-ai">'+display;
        if(m.memData&&!m.memSaved){
          var cat=MEM_CATS[m.memData.cat]||{icon:'📌',label:'Memoria'};
          html+='<div style="margin-top:10px;padding-top:10px;border-top:.5px solid var(--border)">'
            +'<div class="text-xs" style="margin-bottom:6px">'+cat.icon+' Sugerencia ('+cat.label+'):</div>'
            +'<div style="font-size:13px;background:var(--surface);border-radius:8px;padding:8px 10px;margin-bottom:8px">'+esc(m.memData.text)+'</div>'
            +'<div style="display:flex;gap:6px">'
            +'<button class="btn btn-success btn-sm" onclick="saveBrainMem('+idx+')" style="flex:1">📌 Guardar</button>'
            +'<button class="btn btn-secondary btn-sm" onclick="dismissMem('+idx+')">✕</button>'
            +'</div></div>';
        } else if(m.memSaved){
          html+='<div style="margin-top:8px;font-size:12px;color:var(--success)">✅ Guardado</div>';
        }
        html+='</div>';
      }
    });
    html+='</div>';
    var quickies=[['🎯 ¿Cómo responderías a...?','¿Cómo responderías si un prospecto te dice que ya tiene seguro con otra empresa?'],['✏️ Corregir mensaje','Tengo este mensaje que mandé, dime qué cambiarías: '],['📋 Nueva regla','Quiero que de ahora en adelante '],['🗣 Mi tono','Sobre cómo hablo yo, quiero que sepas que ']];
    html+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">';
    quickies.forEach(function(q){ html+='<button class="filter-chip" onclick="setBrainQuick(\''+encodeURIComponent(q[1])+'\')">'+q[0]+'</button>'; });
    html+='</div>'
      +'<div class="chat-input-row">'
      +'<textarea id="brain-input" placeholder="Habla con tu cerebro..." rows="1" style="border-radius:20px" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendBrainChat();}"></textarea>'
      +'<button class="send-btn" onclick="sendBrainChat()"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg></button>'
      +'</div>';
  } else {
    if(!mems.length){ html+='<div class="empty"><div class="empty-icon">📌</div><h3>Sin memorias todavía</h3><p>En la conversación, toca "Guardar" cuando quieras fijar algo permanentemente.</p></div>'; }
    else {
      Object.keys(MEM_CATS).forEach(function(cat){
        var catMems=mems.filter(function(m){return m.cat===cat;});
        if(!catMems.length)return;
        html+='<div class="section-header">'+MEM_CATS[cat].icon+' '+MEM_CATS[cat].label+'</div><div class="card">';
        catMems.forEach(function(m){
          html+='<div class="mem-row"><div style="flex:1;font-size:14px;line-height:1.6">'+esc(m.text)+'</div>'
            +'<div style="display:flex;gap:6px;flex-shrink:0;margin-top:2px">'
            +'<button class="btn btn-secondary btn-sm" onclick="editMem(\''+m.id+'\')" style="padding:4px 8px;font-size:12px">✏️</button>'
            +'<button class="btn btn-secondary btn-sm" onclick="deleteMem(\''+m.id+'\')" style="padding:4px 8px;font-size:12px;color:var(--danger)">✕</button>'
            +'</div></div>';
        });
        html+='</div>';
      });
    }
    html+='<div class="section-header">Añadir memoria</div><div class="card"><div class="card-body">'
      +'<div class="field"><label>Categoría</label><select id="nm-cat">';
    Object.keys(MEM_CATS).forEach(function(k){ html+='<option value="'+k+'">'+MEM_CATS[k].icon+' '+MEM_CATS[k].label+'</option>'; });
    html+='</select></div>'
      +'<div class="field"><label>Memoria</label><textarea id="nm-text" placeholder="Ej: Siempre pregunto por la familia antes de hablar de dinero" style="min-height:70px"></textarea></div>'
      +'<button class="btn btn-primary btn-full" onclick="addMemManual()">📌 Guardar memoria</button>'
      +'</div></div>';
  }
  document.getElementById('brain-content').innerHTML=html;
  setTimeout(function(){var bc=document.getElementById('brain-chat');if(bc)bc.scrollTop=bc.scrollHeight;},50);
}

function setBrainQuick(encoded){ var txt=decodeURIComponent(encoded); var inp=document.getElementById('brain-input'); if(inp){inp.value=txt;inp.focus();inp.setSelectionRange(txt.length,txt.length);} }

async function sendBrainChat(){
  var input=document.getElementById('brain-input');
  var text=input?input.value.trim():'';
  if(!text)return;
  var cfg=loadCfg(); if(!cfg.apiKey){alert('Configura tu API key en ⚙️');return;}
  input.value='';
  brainChat.push({role:'user',content:text});
  brainChat.push({role:'assistant',content:LOADING_DOTS});
  saveBChat(brainChat); renderBrain();
  var sys=buildBrainSys();
  var msgs=brainChat.slice(0,-1).filter(function(m){return m.role==='user'||m.role==='assistant';}).map(function(m){return {role:m.role,content:m.content.replace(/---MEM---[\s\S]*?(\n|$)/g,'').replace(/---DEL---[\s\S]*/g,'').replace(/---EDIT---[\s\S]*/g,'').trim()};}).filter(function(m){return m.content.length>0;});
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':cfg.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:sys,messages:msgs})});
    var data=await res.json();
    var reply=(data.content&&data.content[0]&&data.content[0].text)||'Error.';
    var lastIdx=brainChat.length-1;
    brainChat[lastIdx]={role:'assistant',content:reply};
    if(reply.indexOf('---MEM---')!==-1){
      try{var memStr=reply.split('---MEM---')[1].split('\n')[0].trim();var memData=JSON.parse(memStr);brainChat[lastIdx].memData=memData;brainChat[lastIdx].memSaved=false;}catch(e){}
    }
    if(reply.indexOf('---DEL---')!==-1){var delId=reply.split('---DEL---')[1].split('\n')[0].trim();deleteMem(delId,true);brainChat[lastIdx].content=reply.split('---DEL---')[0].trim()+'\n✅ Memoria eliminada.';}
    if(reply.indexOf('---EDIT---')!==-1){try{var editStr=reply.split('---EDIT---')[1].split('\n')[0].trim();var editData=JSON.parse(editStr);editMemById(editData.id,editData.text);brainChat[lastIdx].content=reply.split('---EDIT---')[0].trim()+'\n✅ Memoria actualizada.';}catch(e){}}
  }catch(e){brainChat[brainChat.length-1]={role:'assistant',content:'Error de conexión. Revisa tu API key.'};}
  saveBChat(brainChat); renderBrain();
}

function saveBrainMem(idx){
  var m=brainChat[idx]; if(!m||!m.memData)return;
  var mem={id:uid(),cat:m.memData.cat,text:m.memData.text,createdAt:new Date().toISOString()};
  var brain=loadBrain(); brain.memories.push(mem); saveBrain(brain);
  postToSheets({type:'brain',data:mem});
  brainChat[idx].memSaved=true; saveBChat(brainChat); renderBrain();
}
function dismissMem(idx){ if(brainChat[idx]){brainChat[idx].memSaved=true;saveBChat(brainChat);renderBrain();} }
function addMemManual(){
  var cat=document.getElementById('nm-cat').value;
  var text=(document.getElementById('nm-text').value||'').trim();
  if(!text){alert('Escribe la memoria primero');return;}
  var mem={id:uid(),cat:cat,text:text,createdAt:new Date().toISOString()};
  var brain=loadBrain(); brain.memories.push(mem); saveBrain(brain);
  postToSheets({type:'brain',data:mem}); renderBrain();
}
function deleteMem(id,silent){
  if(!silent&&!confirm('¿Eliminar esta memoria?'))return;
  var brain=loadBrain(); var idx=brain.memories.findIndex(function(m){return m.id===id;});
  if(idx!==-1){brain.memories[idx].deleted=true;saveBrain(brain);}
  postToSheets({type:'brain_delete',data:{id:id}});
  if(!silent)renderBrain();
}
function editMemById(id,newText){
  var brain=loadBrain(); var idx=brain.memories.findIndex(function(m){return m.id===id;});
  if(idx!==-1){brain.memories[idx].text=newText;saveBrain(brain);postToSheets({type:'brain',data:{id:id,cat:brain.memories[idx].cat,text:newText,createdAt:brain.memories[idx].createdAt}});}
}
function editMem(id){
  var brain=loadBrain(); var mem=brain.memories.find(function(m){return m.id===id;});
  if(!mem)return;
  var newText=prompt('Editar memoria:',mem.text);
  if(!newText||!newText.trim())return;
  mem.text=newText.trim(); saveBrain(brain);
  postToSheets({type:'brain',data:{id:id,cat:mem.cat,text:mem.text,createdAt:mem.createdAt}}); renderBrain();
}
